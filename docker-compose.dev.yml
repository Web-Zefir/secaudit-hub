services:
  postgres:
    image: postgres:16-alpine
    container_name: secaudit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secaudit
    volumes:
      - secaudit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secaudit"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  secaudit_pg_data:
